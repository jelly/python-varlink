[Distribution]
Distribution=arch

[Output]
Format=disk
Output=python-varlink-integration

[Content]
Bootable=yes
Bootloader=none
Packages=
    linux
    python
    python-pytest
ExtraTrees=varlink:/opt/python-varlink/varlink
RemoveFiles=/opt/python-varlink/varlink/tests/__pycache__

[Runtime]
Firmware=linux
RAM=2G
